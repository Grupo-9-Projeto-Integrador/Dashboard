name: CI - Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validar-frontend:
    name: Validar estrutura do frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Listar arquivos do repositorio
        run: |
          echo "Listando arquivos principais:"
          ls -la

      - name: Procurar arquivo index.html
        run: |
          echo "Procurando index.html no projeto..."
          INDEX_FILE=$(find . -name "index.html" | head -n 1)

          if [ -n "$INDEX_FILE" ]; then
            echo "Arquivo index.html encontrado em: $INDEX_FILE"
          else
            echo "Erro: nenhum arquivo index.html foi encontrado no projeto."
            exit 1
          fi

      - name: Verificar arquivos CSS
        run: |
          echo "Procurando arquivos CSS..."
          if find . -name "*.css" | grep -q .; then
            echo "Arquivos CSS encontrados."
          else
            echo "Aviso: nenhum arquivo CSS encontrado."
          fi

      - name: Verificar arquivos JavaScript
        run: |
          echo "Procurando arquivos JavaScript..."
          if find . -name "*.js" | grep -q .; then
            echo "Arquivos JavaScript encontrados."
          else
            echo "Aviso: nenhum arquivo JavaScript encontrado."
          fi

      - name: Validacao concluida
        run: echo "CI do frontend executado com sucesso."
